name: Layer 2 - weekly hiring snapshot (Wednesday 10:30 PM ET)

on:
  schedule:
    - cron: "37 2 * * 4"    # 10:37 PM EDT Wednesday (= 02:37 UTC Thursday, US daylight time) - backup if the claude.ai kick-off routine does not fire
    - cron: "37 3 * * 4"    # 10:37 PM EST Wednesday (US standard time) - the gate step lets either run between 10:00 PM and 11:59 PM New York time on Wednesday, and only once per week
  push:
    branches: [main]
    paths: ["layer2-signal-collector/triggers/hiring.txt"]   # kick-off from the claude.ai routine "Layer 2 - hiring snapshot kickoff" (same gates apply)
  workflow_dispatch:
    inputs:
      args:
        description: "Extra script arguments, e.g. --limit 20  or  --date 2026-10-21"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: layer2-hiring
  cancel-in-progress: false

jobs:
  hiring:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Gate - only run Wednesday 10:00 PM to 11:59 PM New York time, once per week
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          H=$(TZ=America/New_York date +%H)
          W=$(TZ=America/New_York date +%u)
          D=$(TZ=America/New_York date +%F)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$W" != "3" ] || { [ "$H" != "22" ] && [ "$H" != "23" ]; }; then
            echo "New York weekday $W hour $H - outside Wednesday 10:00-11:59 PM, skipping this trigger"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            SINCE=$(TZ=America/New_York date -d "$D 21:59" -u +%Y-%m-%dT%H:%M:%SZ)
            MSGS=$(gh api "repos/${{ github.repository }}/commits?since=$SINCE&per_page=50" --jq '.[].commit.message' 2>/dev/null || true)
            if echo "$MSGS" | grep -q "^Layer 2 hiring snapshot $D"; then
              echo "Layer 2 hiring snapshot $D already taken - skipping this trigger"
              echo "run=false" >> "$GITHUB_OUTPUT"
            else
              echo "run=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Run the hiring snapshot
        if: steps.gate.outputs.run == 'true'
        working-directory: layer2-signal-collector
        run: |
          ARGS="${{ github.event.inputs.args }}"
          python layer2_hiring.py $ARGS

      - name: Commit snapshot
        if: steps.gate.outputs.run == 'true'
        run: |
          D=$(TZ=America/New_York date +%F)
          git config user.name "layer2-bot"
          git config user.email "layer2-bot@users.noreply.github.com"
          git add -A layer2-signal-collector/data
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "Layer 2 hiring snapshot $D"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && break
              echo "push attempt $i failed, retrying"; sleep 15
            done
          fi
